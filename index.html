<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Esquiva los bloques</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;

    overflow-x: hidden;
    touch-action: manipulation;
}

.contenedor {
    text-align: center;
    width: 100%;
    max-width: 450px;
    padding: 10px;
}

h1 {
    margin: 5px 0 10px;
    font-size: clamp(24px, 7vw, 32px);
}

#informacion {
    width: 100%;
    max-width: 400px;

    display: flex;
    justify-content: space-between;

    margin: 10px auto;

    font-size: clamp(16px, 5vw, 20px);
}

#juego {
    position: relative;

    width: min(400px, calc(100vw - 20px));

    aspect-ratio: 2 / 3;

    background:
        linear-gradient(#1e293b, #0f172a);

    border: 3px solid white;

    overflow: hidden;

    margin: auto;

    touch-action: none;
}

#jugador {
    position: absolute;

    width: 40px;
    height: 40px;

    background: #22c55e;

    bottom: 20px;
    left: 0;

    border-radius: 8px;

    box-shadow:
        0 0 15px #22c55e;

    transition: left 0.03s linear;
}

.obstaculo {
    position: absolute;

    width: 40px;
    height: 40px;

    background: #ef4444;

    top: -40px;

    border-radius: 6px;

    box-shadow:
        0 0 15px #ef4444;
}

button {
    background: #22c55e;

    color: white;

    border: none;

    padding: 12px 25px;

    font-size: 18px;

    border-radius: 8px;

    cursor: pointer;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;
}

button:hover {
    background: #16a34a;
}

#mensaje {
    margin-top: 12px;

    font-size: 18px;

    min-height: 25px;
}

.controlesPC {
    margin-top: 12px;

    color: #cbd5e1;

    font-size: 15px;
}

.controlesMovil {
    display: flex;

    justify-content: center;

    gap: 25px;

    margin-top: 15px;
}

.botonMovimiento {
    width: 90px;
    height: 60px;

    padding: 0;

    font-size: 32px;

    background: #334155;

    border: 2px solid #64748b;

    border-radius: 12px;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;

    display: flex;

    justify-content: center;
    align-items: center;
}

.botonMovimiento:active {
    background: #475569;

    transform: scale(0.95);
}

@media (min-width: 601px) {

    .controlesMovil {
        display: none;
    }

}

@media (max-width: 600px) {

    .controlesPC {
        display: none;
    }

    .contenedor {
        padding-top: 5px;
        padding-bottom: 10px;
    }

    button {
        font-size: 17px;
    }

}

</style>
</head>

<body>

<div class="contenedor">

    <h1>🎮 Esquiva los bloques</h1>

    <div id="informacion">

        <span>
            Puntos:
            <b id="puntos">0</b>
        </span>

        <span>
            Récord:
            <b id="record">0</b>
        </span>

    </div>

    <div id="juego">

        <div id="jugador"></div>

    </div>

    <div class="controlesPC">

        ⬅️ A / Flecha izquierda

        &nbsp;&nbsp;&nbsp;

        Flecha derecha / D ➡️

    </div>

    <div class="controlesMovil">

        <button
            class="botonMovimiento"
            id="izquierda">
            ⬅️
        </button>

        <button
            class="botonMovimiento"
            id="derecha">
            ➡️
        </button>

    </div>

    <br>

    <button id="botonIniciar">
        ▶️ Iniciar juego
    </button>

    <div id="mensaje"></div>

</div>


<script>

/* ==================================
   VARIABLES
================================== */

const juego =
    document.getElementById("juego");

const jugador =
    document.getElementById("jugador");

const puntosTexto =
    document.getElementById("puntos");

const recordTexto =
    document.getElementById("record");

const mensaje =
    document.getElementById("mensaje");

const botonIniciar =
    document.getElementById("botonIniciar");

const botonIzquierda =
    document.getElementById("izquierda");

const botonDerecha =
    document.getElementById("derecha");


let jugadorX = 0;

let puntos = 0;

let record =
    Number(localStorage.getItem("record")) || 0;

let jugando = false;

let velocidad = 4;

let obstaculos = [];

let intervaloObstaculos = null;

let animacion = null;


/* ==================================
   MÚSICA
================================== */

let audioContext = null;

let musicaActiva = false;

let intervaloMusica = null;

let posicionNota = 0;


const notas = [

    261.63,
    293.66,
    329.63,
    392.00,
    329.63,
    293.66,
    261.63,
    196.00

];


recordTexto.textContent = record;


/* ==================================
   POSICIÓN DEL JUGADOR
================================== */

function colocarJugador() {

    const anchoJuego =
        juego.clientWidth;

    const anchoJugador =
        jugador.offsetWidth;

    const maxX =
        anchoJuego - anchoJugador;


    if (jugadorX < 0) {
        jugadorX = 0;
    }


    if (jugadorX > maxX) {
        jugadorX = maxX;
    }


    jugador.style.left =
        jugadorX + "px";

}


/* ==================================
   ACTIVAR MÚSICA
================================== */

function activarMusica() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }


    if (musicaActiva) {
        return;
    }


    musicaActiva = true;

    posicionNota = 0;


    reproducirNota();


    intervaloMusica =
        setInterval(
            reproducirNota,
            400
        );

}


/* ==================================
   DETENER MÚSICA
================================== */

function detenerMusica() {

    musicaActiva = false;


    clearInterval(
        intervaloMusica
    );


    intervaloMusica = null;

}


/* ==================================
   REPRODUCIR NOTA
================================== */

function reproducirNota() {

    if (
        !musicaActiva ||
        !audioContext
    ) {

        return;

    }


    const oscilador =
        audioContext.createOscillator();


    const ganancia =
        audioContext.createGain();


    oscilador.type =
        "square";


    oscilador.frequency.value =
        notas[posicionNota];


    ganancia.gain.setValueAtTime(
        0.04,
        audioContext.currentTime
    );


    ganancia.gain.exponentialRampToValueAtTime(

        0.001,

        audioContext.currentTime + 0.35

    );


    oscilador.connect(
        ganancia
    );


    ganancia.connect(
        audioContext.destination
    );


    oscilador.start();


    oscilador.stop(
        audioContext.currentTime + 0.35
    );


    posicionNota++;


    if (
        posicionNota >= notas.length
    ) {

        posicionNota = 0;

    }

}


/* ==================================
   SONIDO GAME OVER
================================== */

function sonidoGameOver() {

    if (!audioContext) {
        return;
    }


    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }


    const ahora =
        audioContext.currentTime;


    const notasGameOver = [

        220,
        165,
        110

    ];


    notasGameOver.forEach(

        function(frecuencia, i) {

            const oscilador =
                audioContext.createOscillator();


            const ganancia =
                audioContext.createGain();


            oscilador.type =
                "sawtooth";


            oscilador.frequency.value =
                frecuencia;


            const inicio =
                ahora + (i * 0.18);


            ganancia.gain.setValueAtTime(
                0.08,
                inicio
            );


            ganancia.gain.exponentialRampToValueAtTime(

                0.001,

                inicio + 0.17

            );


            oscilador.connect(
                ganancia
            );


            ganancia.connect(
                audioContext.destination
            );


            oscilador.start(
                inicio
            );


            oscilador.stop(
                inicio + 0.18
            );

        }

    );

}


/* ==================================
   MOVER JUGADOR
================================== */

function moverJugador(direccion) {

    if (!jugando) {
        return;
    }


    jugadorX +=
        direccion * 20;


    colocarJugador();

}


/* ==================================
   TECLADO PC
================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (!jugando) {
            return;
        }


        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            event.preventDefault();

            moverJugador(-1);

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            event.preventDefault();

            moverJugador(1);

        }

    }
);


/* ==================================
   CONTROLES TÁCTILES
================================== */

let intervaloMovimiento = null;


function comenzarMovimiento(direccion) {

    if (!jugando) {
        return;
    }


    moverJugador(direccion);


    clearInterval(
        intervaloMovimiento
    );


    intervaloMovimiento =
        setInterval(
            function() {

                moverJugador(
                    direccion
                );

            },
            80
        );

}


function detenerMovimiento() {

    clearInterval(
        intervaloMovimiento
    );

    intervaloMovimiento = null;

}


/* IZQUIERDA */

botonIzquierda.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        comenzarMovimiento(-1);

    },
    { passive: false }
);


botonIzquierda.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        detenerMovimiento();

    },
    { passive: false }
);


botonIzquierda.addEventListener(
    "touchcancel",
    detenerMovimiento
);


/* DERECHA */

botonDerecha.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        comenzarMovimiento(1);

    },
    { passive: false }
);


botonDerecha.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        detenerMovimiento();

    },
    { passive: false }
);


botonDerecha.addEventListener(
    "touchcancel",
    detenerMovimiento
);


/* RATÓN */

botonIzquierda.addEventListener(
    "mousedown",
    function() {

        comenzarMovimiento(-1);

    }
);


botonDerecha.addEventListener(
    "mousedown",
    function() {

        comenzarMovimiento(1);

    }
);


document.addEventListener(
    "mouseup",
    detenerMovimiento
);


/* ==================================
   INICIAR JUEGO
================================== */

function iniciarJuego() {

    activarMusica();


    obstaculos.forEach(
        o => o.element.remove()
    );


    obstaculos = [];


    puntos = 0;

    velocidad = 4;


    jugadorX =
        (juego.clientWidth -
         jugador.offsetWidth) / 2;


    puntosTexto.textContent =
        puntos;


    colocarJugador();


    jugando = true;


    mensaje.textContent = "";


    clearInterval(
        intervaloObstaculos
    );


    cancelAnimationFrame(
        animacion
    );


    intervaloObstaculos =
        setInterval(
            crearObstaculo,
            800
        );


    moverObstaculos();

}


/* ==================================
   BOTÓN INICIAR
================================== */

botonIniciar.addEventListener(
    "click",
    iniciarJuego
);


/* ==================================
   CREAR OBSTÁCULO
================================== */

function crearObstaculo() {

    if (!jugando) {
        return;
    }


    const obstaculo =
        document.createElement("div");


    obstaculo.classList.add(
        "obstaculo"
    );


    const maxX =
        juego.clientWidth - 40;


    const x =
        Math.floor(
            Math.random() *
            (maxX + 1)
        );


    obstaculo.style.left =
        x + "px";


    obstaculo.style.top =
        "-40px";


    juego.appendChild(
        obstaculo
    );


    obstaculos.push({

        element:
            obstaculo,

        y:
            -40,

        x:
            x,

        contado:
            false

    });

}


/* ==================================
   MOVER OBSTÁCULOS
================================== */

function moverObstaculos() {

    if (!jugando) {
        return;
    }


    for (
        let i =
            obstaculos.length - 1;

        i >= 0;

        i--
    ) {

        const obstaculo =
            obstaculos[i];


        obstaculo.y +=
            velocidad;


        obstaculo.element.style.top =
            obstaculo.y + "px";


        /* COLISIÓN */

        if (
            colisiona(
                jugador,
                obstaculo.element
            )
        ) {

            terminarJuego();

            return;

        }


        /* PUNTOS */

        const alturaJuego =
            juego.clientHeight;


        if (
            !obstaculo.contado &&
            obstaculo.y >
            alturaJuego - 40
        ) {

            obstaculo.contado = true;


            puntos++;


            puntosTexto.textContent =
                puntos;


            if (
                puntos % 5 === 0
            ) {

                velocidad += 0.5;

            }

        }


        /* ELIMINAR */

        if (
            obstaculo.y >
            alturaJuego + 40
        ) {

            obstaculo.element.remove();


            obstaculos.splice(
                i,
                1
            );

        }

    }


    animacion =
        requestAnimationFrame(
            moverObstaculos
        );

}


/* ==================================
   COLISIONES
================================== */

function colisiona(a, b) {

    const rectA =
        a.getBoundingClientRect();


    const rectB =
        b.getBoundingClientRect();


    return !(
        rectA.right < rectB.left ||
        rectA.left > rectB.right ||
        rectA.bottom < rectB.top ||
        rectA.top > rectB.bottom
    );

}


/* ==================================
   GAME OVER
================================== */

function terminarJuego() {

    jugando = false;


    detenerMovimiento();


    clearInterval(
        intervaloObstaculos
    );


    cancelAnimationFrame(
        animacion
    );


    /*
       ⏹️ PARAR MÚSICA
    */

    detenerMusica();


    /*
       💥 SONIDO DE PARTIDA PERDIDA
    */

    sonidoGameOver();


    /*
       🏆 RÉCORD
    */

    if (puntos > record) {

        record = puntos;


        localStorage.setItem(
            "record",
            record
        );


        recordTexto.textContent =
            record;


        mensaje.textContent =
            "🏆 ¡NUEVO RÉCORD! " +
            puntos +
            " puntos.";

    }
    else {

        mensaje.textContent =
            "💥 GAME OVER — " +
            puntos +
            " puntos.";

    }

}


/* ==================================
   CAMBIO DE TAMAÑO
================================== */

window.addEventListener(
    "resize",
    function() {

        colocarJugador();

    }
);


/* ==================================
   POSICIÓN INICIAL
================================== */

jugadorX =
    (juego.clientWidth -
     jugador.offsetWidth) / 2;

colocarJugador();

</script>

</body>
</html>
